name: Regenerate README Badges & Banner

on:
  push:
    paths:
      - 'prompts.js'
      - 'scripts/generate-readme-badges.py'
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate banner, prompt map & badge markdown
        run: python scripts/generate-readme-badges.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/readme-banner.svg assets/prompt-map.svg assets/README-BADGES.md
          git diff --staged --quiet || git commit -m "chore: auto-update README banner & badges from prompts.js"
          git push
